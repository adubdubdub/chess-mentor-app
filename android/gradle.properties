# Begrenzt, obwohl LXC 100 seit 08.11.2026 16 GB hat; die harte Grenze setzt tools/build-apk.sh: Gradle klein halten, kein dauerhafter Daemon, Kotlin im Gradle-Prozess
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
