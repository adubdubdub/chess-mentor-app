# LXC 100 hat ca. 4 GB frei: Gradle klein halten, kein dauerhafter Daemon, Kotlin im Gradle-Prozess
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
# Nur arm64: die Stockfish-Plugins legen sonst fest 3 Architekturen in ihrer build.gradle fest
android.injected.build.abi=arm64-v8a
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
